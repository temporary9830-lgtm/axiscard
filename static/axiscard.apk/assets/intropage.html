<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis Bank Portal</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          background: #ffffff;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
        }

        .splash-logo {
          width: 140px;
          height: 140px;
          display: flex;
          align-items: center;
          justify-content: center;
          animation: pulse 1.8s infinite ease-in-out;
        }

        .splash-logo img {
          width: 100%;
          height: 100%;
          object-fit: contain;
        }

        @keyframes pulse {
          0% { transform: scale(0.96); opacity: 0.9; }
          50% { transform: scale(1.04); opacity: 1; }
          100% { transform: scale(0.96); opacity: 0.9; }
        }
    </style>
</head>
<body>

<div class="splash-logo">
    <img src="https://mycard-axis.vercel.app/image/alogo.png" alt="Axis Bank Logo">
</div>

<script>
    // 3 সেকেন্ড পর সোজাসুজি home.html এ রিডাইরেক্ট হবে
    setTimeout(() => {
      window.location.href = "home.html";
    }, 3000);
</script>

</body>
</html>
