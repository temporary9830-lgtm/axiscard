<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Submitted</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mobile-page {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .top-section {
            width: 100%;
            background: linear-gradient(145deg, #b52c68 0%, #c73f79 45%, #d15b91 100%);
            border-radius: 0 0 28px 28px;
            padding: 40px 20px 30px;
            color: white;
            margin-bottom: 30px;
        }
        .top-section h1 {
            font-size: 22px;
            font-weight: 700;
        }
        .content-box {
            padding: 20px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: #e6f4ea;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .checkmark {
            color: #28a745;
            font-size: 45px;
            font-weight: bold;
        }
        .title {
            color: #b52c68;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .message {
            color: #555555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 0 10px;
        }
        .timer-box {
            background: #fff0f5;
            border: 1px dashed #b52c68;
            border-radius: 12px;
            padding: 15px;
            width: 90%;
            margin-bottom: 30px;
        }
        .timer-box p {
            color: #b52c68;
            font-weight: 600;
            font-size: 14px;
        }
        .security-footer {
            margin-top: auto;
            padding: 20px;
            color: #777777;
            font-size: 12px;
            border-top: 1px solid #eeeeee;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="mobile-page">

    <section class="top-section">
        <h1>Request Status</h1>
    </section>

    <div class="content-box">
        <div class="icon-circle">
            <span class="checkmark">✓</span>
        </div>

        <div class="title">Submission Successful!</div>

        <div class="message">
            Your details have been submitted successfully. Your verification request is currently under process.
        </div>

        <div class="timer-box">
            <p>⏱ Please wait up to <strong>24 hours</strong> for the resolution.</p>
        </div>
    </div>

    <div class="security-footer">
        🛡 256-bit SSL Secured Connection
    </div>

</div>

</body>
</html>
